# Stack de produção standalone: `docker compose -f docker-compose.prod.yml up -d`
# sobe frontend + backend + telegram_gateway. Infra (Postgres/Redis/Ollama/
# Evolution) fica externa — use `docker-compose.all.yml` para o stack completo.
#
# Diferenças deliberadas em relação a docker-compose.yml (dev local):
# - Sem jeff_ia_postgres/jeff_ia_redis/jeff_ia_pgadmin: Postgres/Redis do
#   Jeff AI são GERENCIADOS externamente em produção — POSTGRES_URI e
#   REDIS_URI (ver ../.env.example) apontam pra essas instâncias, sem default
#   interno (falha alto e claro se ausentes).
# - frontend builda com `target: prod` (next build && next start), não
#   `next dev` — ver frontend/Dockerfile.frontend.
# - Evolution API (WhatsApp) NÃO é gerenciada por este compose — roda como
#   serviço externo próprio (ver EVOLUTION_API_URL/_API_KEY/_INSTANCE_NAME/
#   _WEBHOOK_TOKEN abaixo, que só apontam pra ela). Já foi um serviço
#   autocontido aqui (evolution_postgres/evolution_redis/evolution_api);
#   removido deste arquivo — não confundir com relatos antigos.
# - telegram_gateway entra aqui (mesma imagem do backend; polling do bot).
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.backend
    container_name: jeff_ia_backend
    ports:
      - "8005:8000"
    # Sem OPENROUTER_API_KEY o grafo `unified` falha no boot (ChatOpenRouter).
    # No Portainer: declare a key no Environment do stack (não use env_file —
    # o path .env não existe no host do compose gerenciado pelo Portainer).
    environment:
      POSTGRES_URI: ${POSTGRES_URI:?defina POSTGRES_URI em .env}
      REDIS_URI: ${REDIS_URI:?defina REDIS_URI em .env}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY}
      LANGCHAIN_TRACING_V2: true
      LANGSMITH_PROJECT: jeff_ai_project
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://localhost:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-minimax-m2.7:cloud}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-32768}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-mxbai-embed-large}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?defina OPENROUTER_API_KEY em .env}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openrouter/free}
      OPENROUTER_APP_URL: ${OPENROUTER_APP_URL:-http://localhost:3000}
      OPENROUTER_APP_TITLE: ${OPENROUTER_APP_TITLE:-Jeff AI}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GOOGLE_MODEL: ${GOOGLE_MODEL:-gemini-2.5-flash}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      SESSION_TTL: ${SESSION_TTL:-3600}
      INTEGRATION_CREDENTIALS_KEY: ${INTEGRATION_CREDENTIALS_KEY:-}
      # Cookie compartilhado entre jeff.* e jeff-api.* (middleware Next lê no front).
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      JEFF_AI_TZ: ${JEFF_AI_TZ:-UTC}
      TZ: ${JEFF_AI_TZ:-UTC}
      # Ver comentário equivalente em docker-compose.yml — sem estas duas, o
      # processo nunca via FRONTEND_ORIGIN/BASE_URL como env var própria
      # (só eram usadas para interpolar CORS_ALLOW_ORIGINS/LANGGRAPH_HTTP
      # neste arquivo), e `WhatsAppChannel`/`build_create_document` caíam no
      # fallback hardcoded `http://localhost:3000`, inalcançável por chamadores
      # externos (Evolution API).
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3002}
      BASE_URL: ${BASE_URL:-}
      # Origem pública do API para URLs absolutas de imagens geradas
      # (`public_api_origin` / return-public-image-url).
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?defina NEXT_PUBLIC_API_URL em .env}
      EVOLUTION_API_URL: ${EVOLUTION_API_URL:-http://evolution_api:8080}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:?defina EVOLUTION_API_KEY em .env}
      EVOLUTION_INSTANCE_NAME: ${EVOLUTION_INSTANCE_NAME:-jeff-ai-central}
      EVOLUTION_WEBHOOK_TOKEN: ${EVOLUTION_WEBHOOK_TOKEN:?defina EVOLUTION_WEBHOOK_TOKEN em .env}
      SKILLS_ALLOWLIST: ${SKILLS_ALLOWLIST:-usenotra/skills}
      LANGGRAPH_STORE: '{"type": "postgres", "url": "$${env:POSTGRES_URI}", "index": {"embed": "./src/models/ollama_embeddings.py:embed_texts", "dims": 1024, "fields": ["content"]}}'
      LANGGRAPH_CHECKPOINTER: '{"type": "postgres", "url": "$${env:POSTGRES_URI}"}'
      # Espelha a seção "http" do langgraph.json — ver docker-compose.yml para
      # a nota completa sobre por que essa var é obrigatória.
      LANGGRAPH_HTTP: '{"app": "./src/infrastructure/web/webapp.py:app", "cors": {"allow_origins": ["${FRONTEND_ORIGIN:-http://localhost:3002}"], "allow_credentials": true, "allow_methods": ["*"], "allow_headers": ["*"]}}'
      # Espelha auth.path do langgraph.json — ver docker-compose.yml (LANGGRAPH_AUTH).
      LANGGRAPH_AUTH: '{"path": "./src/infrastructure/web/auth.py:auth"}'
      CORS_ALLOW_ORIGINS: ${FRONTEND_ORIGIN:-http://localhost:3002}
      # Em produção o código já vai na imagem (Dockerfile.backend COPY).
      # NÃO bind-montar ./backend/src nem ./backend/langgraph.json no Portainer:
      # se o path não existir no host, o Docker cria um DIRETÓRIO no lugar do
      # arquivo e o deploy quebra com "not a directory" / "mount ... file".
      # Só volumes nomeados para dados mutáveis em runtime.
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-conexaoelite_jeff_bot}
      WHATSAPP_BUSINESS_NUMBER: ${WHATSAPP_BUSINESS_NUMBER:-5561947581258}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-http://localhost:8001/api/email/accounts/gmail/callback}
    volumes:
      - backend_outputs:/deps/backend/outputs
      - backend_files:/deps/backend/files
      - backend_skills:/deps/backend/skills
      - backend_generated:/deps/backend/src/tools/generated
    networks:
      - jeff_ia-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile.frontend
      target: prod
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?defina NEXT_PUBLIC_API_URL em .env}
    container_name: jeff_ia_frontend
    ports:
      - "3002:3000"
    environment:
      # Também setada em runtime (além do build arg acima) para os `rewrites()`
      # server-side de next.config.ts que leem process.env a cada request.
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?defina NEXT_PUBLIC_API_URL em .env}
      BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://backend:8000}
    depends_on:
      - backend
    networks:
      - jeff_ia-network

  # Polling do bot Telegram (mesma imagem do backend). Sem TELEGRAM_* o
  # bootstrap falha rápido. Compartilha `backend_outputs` e `backend_files`
  # com o backend para as tools de mídia resolverem paths gerados.
  telegram_gateway:
    build:
      context: .
      dockerfile: backend/Dockerfile.backend
    container_name: jeff_ia_telegram_gateway
    restart: unless-stopped
    environment:
      POSTGRES_URI: ${POSTGRES_URI:?defina POSTGRES_URI em .env}
      REDIS_URI: ${REDIS_URI:?defina REDIS_URI em .env}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?defina TELEGRAM_BOT_TOKEN em .env}
      TELEGRAM_AUTHORIZED_CHAT_ID: ${TELEGRAM_AUTHORIZED_CHAT_ID:?defina TELEGRAM_AUTHORIZED_CHAT_ID em .env}
      TELEGRAM_LEGACY_OWNER_USER_ID: ${TELEGRAM_LEGACY_OWNER_USER_ID:-}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3002}
      BASE_URL: ${BASE_URL:-}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?defina NEXT_PUBLIC_API_URL em .env}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://localhost:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-minimax-m2.7:cloud}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?defina OPENROUTER_API_KEY em .env}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openrouter/free}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      INTEGRATION_CREDENTIALS_KEY: ${INTEGRATION_CREDENTIALS_KEY:-}
      JEFF_AI_TZ: ${JEFF_AI_TZ:-UTC}
      TZ: ${JEFF_AI_TZ:-UTC}
    depends_on:
      - backend
    volumes:
      - backend_outputs:/deps/backend/outputs
      - backend_files:/deps/backend/files
    # Substitui o ENTRYPOINT da imagem langgraph-api (uvicorn) — ver nota
    # completa em docker-compose.yml.
    entrypoint: ["/bin/sh", "/deps/backend/telegram_gateway_entrypoint.sh"]
    # A imagem base traz healthcheck HTTP :8000 (langgraph-api). O gateway
    # não sobe uvicorn — só polling do Telegram — então o probe marca
    # unhealthy à toa. Desliga o healthcheck herdado.
    healthcheck:
      disable: true
    networks:
      - jeff_ia-network

  # === Email Sync Worker (change email-client-imap-mvp) ===
  # Mesma imagem do backend, entrypoint customizado para rodar o loop do
  # `email_sync_worker` em vez do `uvicorn` herdado. `POSTGRES_URI` já é
  # obrigatória no `.env` em produção (`docker-compose.prod.yml` falha
  # rápido se estiver ausente), então aqui usamos `${VAR:?…}` para
  # preservar o gate — mesmo padrão do `backend`/`telegram_gateway` neste
  # compose. `EMAIL_SYNC_POLL_INTERVAL_SECONDS` é opcional com default
  # conservador dentro do script Python; o operador pode tunar via `.env`
  # sem rebuild.
  email_sync_worker:
    build:
      context: .
      dockerfile: backend/Dockerfile.backend
    container_name: jeff_ia_email_sync_worker
    restart: unless-stopped
    environment:
      POSTGRES_URI: ${POSTGRES_URI:?defina POSTGRES_URI em .env}
      EMAIL_SYNC_POLL_INTERVAL_SECONDS: ${EMAIL_SYNC_POLL_INTERVAL_SECONDS:-60}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3002}
      BASE_URL: ${BASE_URL:-}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?defina NEXT_PUBLIC_API_URL em .env}
      JEFF_AI_TZ: ${JEFF_AI_TZ:-UTC}
      TZ: ${JEFF_AI_TZ:-UTC}
      INTEGRATION_CREDENTIALS_KEY: ${INTEGRATION_CREDENTIALS_KEY:-}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-http://localhost:8001/api/email/accounts/gmail/callback}
    depends_on:
      - backend
    # Substitui o ENTRYPOINT da imagem langgraph-api (uvicorn) — ver nota
    # completa em docker-compose.yml.
    entrypoint: ["/bin/sh", "/deps/backend/email_sync_worker_entrypoint.sh"]
    # Sem healthcheck: loop asyncio sem porta exposta. Mesmo tratamento
    # do `telegram_gateway` neste compose.
    healthcheck:
      disable: true
    networks:
      - jeff_ia-network

networks:
  jeff_ia-network:
    driver: bridge

volumes:
  backend_outputs:
  backend_files:
  backend_skills:
  backend_generated:
