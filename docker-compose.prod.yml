# Stack de produção standalone: `docker compose -f docker-compose.prod.yml up -d`
# sobe apenas frontend + backend. Telegram e demais canais/infra ficam fora
# deste arquivo — use `docker-compose.all.yml` ou um processo/stack externo.
#
# Diferenças deliberadas em relação a docker-compose.yml (dev local):
# - Sem jeff_ia_postgres/jeff_ia_redis/jeff_ia_pgadmin: Postgres/Redis do
#   Jeff AI são GERENCIADOS externamente em produção — POSTGRES_URI e
#   REDIS_URI (ver ../.env.example) apontam pra essas instâncias, sem default
#   interno (falha alto e claro se ausentes).
# - frontend builda com `target: prod` (next build && next start), não
#   `next dev` — ver frontend/Dockerfile.frontend.
# - Evolution API (WhatsApp) NÃO é gerenciada por este compose — roda como
#   serviço externo próprio (ver EVOLUTION_API_URL/_API_KEY/_INSTANCE_NAME/
#   _WEBHOOK_TOKEN abaixo, que só apontam pra ela). Já foi um serviço
#   autocontido aqui (evolution_postgres/evolution_redis/evolution_api);
#   removido deste arquivo — não confundir com relatos antigos.
# - telegram_gateway NÃO entra neste arquivo (prod = app only).
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.backend
    container_name: jeff_ia_backend
    ports:
      - "8005:8000"
    environment:
      POSTGRES_URI: ${POSTGRES_URI:?defina POSTGRES_URI em .env}
      REDIS_URI: ${REDIS_URI:?defina REDIS_URI em .env}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY}
      LANGCHAIN_TRACING_V2: true
      LANGSMITH_PROJECT: jeff_ai_project
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://localhost:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-minimax-m2.7:cloud}
      JEFF_AI_TZ: ${JEFF_AI_TZ:-UTC}
      # Ver comentário equivalente em docker-compose.yml — sem estas duas, o
      # processo nunca via FRONTEND_ORIGIN/BASE_URL como env var própria
      # (só eram usadas para interpolar CORS_ALLOW_ORIGINS/LANGGRAPH_HTTP
      # neste arquivo), e `WhatsAppChannel`/`build_create_document` caíam no
      # fallback hardcoded `http://localhost:3000`, inalcançável por chamadores
      # externos (Evolution API).
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3002}
      BASE_URL: ${BASE_URL:-}
      EVOLUTION_API_URL: ${EVOLUTION_API_URL:-http://evolution_api:8080}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:?defina EVOLUTION_API_KEY em .env}
      EVOLUTION_INSTANCE_NAME: ${EVOLUTION_INSTANCE_NAME:-jeff-ai-central}
      EVOLUTION_WEBHOOK_TOKEN: ${EVOLUTION_WEBHOOK_TOKEN:?defina EVOLUTION_WEBHOOK_TOKEN em .env}
      SKILLS_ALLOWLIST: ${SKILLS_ALLOWLIST:-usenotra/skills}
      LANGGRAPH_STORE: '{"type": "postgres", "url": "$${env:POSTGRES_URI}", "index": {"embed": "./src/models/ollama_embeddings.py:embed_texts", "dims": 1024, "fields": ["content"]}}'
      LANGGRAPH_CHECKPOINTER: '{"type": "postgres", "url": "$${env:POSTGRES_URI}"}'
      # Espelha a seção "http" do langgraph.json — ver docker-compose.yml para
      # a nota completa sobre por que essa var é obrigatória.
      LANGGRAPH_HTTP: '{"app": "./src/infrastructure/web/webapp.py:app", "cors": {"allow_origins": ["${FRONTEND_ORIGIN:-http://localhost:3002}"], "allow_credentials": true, "allow_methods": ["*"], "allow_headers": ["*"]}}'
      # Espelha auth.path do langgraph.json — ver docker-compose.yml (LANGGRAPH_AUTH).
      LANGGRAPH_AUTH: '{"path": "./src/infrastructure/web/auth.py:auth"}'
      CORS_ALLOW_ORIGINS: ${FRONTEND_ORIGIN:-http://localhost:3002}
    volumes:
      - ./backend/outputs:/deps/backend/outputs
      - ./backend/langgraph.json:/deps/backend/langgraph.json
      - ./backend/skills:/deps/backend/skills
      - ./backend/src:/deps/backend/src
      - ./backend/src/tools/generated:/deps/backend/src/tools/generated
    networks:
      - jeff_ia-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile.frontend
      target: prod
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?defina NEXT_PUBLIC_API_URL em .env}
    container_name: jeff_ia_frontend
    ports:
      - "3002:3000"
    environment:
      # Também setada em runtime (além do build arg acima) para os `rewrites()`
      # server-side de next.config.ts que leem process.env a cada request.
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?defina NEXT_PUBLIC_API_URL em .env}
      BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://backend:8000}
    depends_on:
      - backend
    networks:
      - jeff_ia-network


networks:
  jeff_ia-network:
    driver: bridge
