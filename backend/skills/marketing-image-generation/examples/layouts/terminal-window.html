<!--
  Terminal / code window mockup centered on a dark page. For developer tools,
  CLIs, and install-command cards. Generic prompt lines.
-->
<div
  style={{
    display: 'flex',
    height: '100%',
    width: '100%',
    alignItems: 'center',
    justifyContent: 'center',
    fontFamily: 'Inter, sans-serif',
    backgroundColor: '#0a0a12',
    backgroundImage: 'radial-gradient(circle at 50% 40%, rgba(34,197,94,0.12), transparent 60%)',
  }}
>
  <div
    style={{
      display: 'flex',
      flexDirection: 'column',
      width: 820,
      backgroundColor: '#0d1117',
      borderRadius: 16,
      border: '1px solid #1f2937',
      boxShadow: '0 40px 80px rgba(0,0,0,0.5)',
      overflow: 'hidden',
    }}
  >
    <div style={{ display: 'flex', alignItems: 'center', height: 44, backgroundColor: '#161b22', padding: '0px 18px' }}>
      <div style={{ display: 'flex', width: 12, height: 12, borderRadius: 999, backgroundColor: '#ef4444', marginRight: 8 }} />
      <div style={{ display: 'flex', width: 12, height: 12, borderRadius: 999, backgroundColor: '#f59e0b', marginRight: 8 }} />
      <div style={{ display: 'flex', width: 12, height: 12, borderRadius: 999, backgroundColor: '#22c55e' }} />
      <div style={{ display: 'flex', fontSize: 14, color: '#6b7280', marginLeft: 18 }}>~/project</div>
    </div>
    <div style={{ display: 'flex', flexDirection: 'column', padding: 28, fontFamily: 'monospace' }}>
      <div style={{ display: 'flex', fontSize: 22, marginBottom: 14 }}>
        <div style={{ display: 'flex', color: '#22c55e', marginRight: 12 }}>$</div>
        <div style={{ display: 'flex', color: '#e5e7eb' }}>install the-package</div>
      </div>
      <div style={{ display: 'flex', fontSize: 19, color: '#9ca3af', marginBottom: 8 }}>Resolving dependencies...</div>
      <div style={{ display: 'flex', fontSize: 19, color: '#9ca3af', marginBottom: 14 }}>Added 1 package in 0.4s</div>
      <div style={{ display: 'flex', fontSize: 22 }}>
        <div style={{ display: 'flex', color: '#22c55e', marginRight: 12 }}>$</div>
        <div style={{ display: 'flex', color: '#e5e7eb' }}>run start</div>
        <div style={{ display: 'flex', width: 12, height: 24, backgroundColor: '#e5e7eb', marginLeft: 6 }} />
      </div>
    </div>
  </div>
